name: tattoo_studio
description: Local-first tattoo design editor with smart image extraction.
publish_to: none
version: 0.9.4+14

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.13.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/placement/full_body.html
    - assets/placement/models/makehuman_cc0.obj
    - assets/placement/viewer.html
