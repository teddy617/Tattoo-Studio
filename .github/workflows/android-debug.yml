name: Build Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=tattoo_studio

      - name: Install dependencies
        run: flutter pub get

      - name: Verify offline 3D placement renderer
        run: node tools/verify_placement.js

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tattoo-studio-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
