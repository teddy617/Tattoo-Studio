<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#202127;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#msg{position:absolute;bottom:12px;left:12px;color:#ddd;font:12px sans-serif;pointer-events:none}</style></head>
<body><canvas id="view"></canvas><div id="msg">Drag to turn • Pinch to zoom</div>
<script>
'use strict';
// Offline first-pass WebGL proof: tapered, curved limb and UV-anchored tattoo.
// No external scripts, downloads or network are required.
const canvas=document.getElementById('view'), gl=canvas.getContext('webgl',{alpha:false,antialias:true});
let program,mesh,texture,rot=0.4,tilt=0,zoom=4.1,opacity=0.9,scale=0.65,orientation=0;
let loaded=false, touchDistance=0,down=false,px=0,py=0;
function status(s){if(window.PlacementBridge)PlacementBridge.postMessage(s);document.getElementById('msg').textContent=s==='ready'?'Drag to turn • Pinch to zoom':s}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function init(){
 if(!gl){status('WebGL unavailable');return}
 const vs=`attribute vec3 pos;attribute vec3 normal;attribute vec2 uv;uniform float yaw;uniform float pitch;uniform float zoom;uniform float ratio;varying vec3 n;varying vec2 coord;void main(){float cy=cos(yaw),sy=sin(yaw),cx=cos(pitch),sx=sin(pitch);vec3 p=vec3(cy*pos.x+sy*pos.z,pos.y,-sy*pos.x+cy*pos.z);vec3 nn=vec3(cy*normal.x+sy*normal.z,normal.y,-sy*normal.x+cy*normal.z);p=vec3(p.x,cx*p.y-sx*p.z,sx*p.y+cx*p.z);n=normalize(vec3(nn.x,cx*nn.y-sx*nn.z,sx*nn.y+cx*nn.z));float z=p.z+zoom;gl_Position=vec4(p.x/(ratio*z)*2.6,p.y/z*2.6,(z-2.0)/6.0,1.0);coord=uv;}`;
 const fs=`precision mediump float;varying vec3 n;varying vec2 coord;uniform sampler2D ink;uniform float alpha;uniform float size;uniform float orientation;uniform float hasInk;void main(){vec3 skin=vec3(0.67,0.50,0.43);float light=0.66+0.34*max(dot(normalize(n),normalize(vec3(0.4,0.5,1.0))),0.0);vec2 local=vec2((coord.x<0.5?coord.x:coord.x-1.0),coord.y-0.5)/size;float c=cos(orientation),s=sin(orientation);local=vec2(c*local.x-s*local.y,s*local.x+c*local.y)+0.5;vec4 decal=vec4(0.0);if(local.x>=0.0&&local.x<=1.0&&local.y>=0.0&&local.y<=1.0&&hasInk>0.5)decal=texture2D(ink,local);vec3 color=mix(skin,decal.rgb,decal.a*alpha);gl_FragColor=vec4(color*light,1.0);}`;
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 gl.useProgram(program);
 const verts=[],indices=[],rings=48,sides=96;
 for(let y=0;y<=rings;y++){const v=y/rings;const h=(v-0.5)*2.6;const radius=0.49+0.16*v;for(let a=0;a<=sides;a++){const u=a/sides,angle=u*Math.PI*2;verts.push(radius*Math.sin(angle),h,radius*Math.cos(angle),Math.sin(angle),0,Math.cos(angle),u,v)}}
 for(let y=0;y<rings;y++)for(let a=0;a<sides;a++){const i=y*(sides+1)+a;indices.push(i,i+1,i+sides+1,i+1,i+sides+2,i+sides+1)}
 mesh=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,mesh);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
 const ind=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ind);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
 for(const [name,offset,length] of [['pos',0,3],['normal',3,3],['uv',6,2]]){const attr=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,length,gl.FLOAT,false,32,offset*4)}
 texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
 gl.enable(gl.DEPTH_TEST);status('ready');requestAnimationFrame(draw);
}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 if(canvas.width!==w*devicePixelRatio||canvas.height!==h*devicePixelRatio){canvas.width=Math.max(1,Math.round(w*devicePixelRatio));canvas.height=Math.max(1,Math.round(h*devicePixelRatio))}
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.12,.13,.16,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);
 const U=(key,val)=>gl.uniform1f(gl.getUniformLocation(program,key),val);
 U('yaw',rot);U('pitch',tilt);U('zoom',zoom);U('ratio',canvas.width/canvas.height);
 U('alpha',opacity);U('size',scale);U('orientation',orientation);U('hasInk',loaded?1:0);
 gl.drawElements(gl.TRIANGLES,48*96*6,gl.UNSIGNED_SHORT,0);
 requestAnimationFrame(draw);
}
function setTattoo(dataUri){const image=new Image();image.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,1);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);loaded=true;status('ready')};image.onerror=()=>status('Tattoo texture failed');image.src=dataUri}
function setPlacement(json){const p=typeof json==='string'?JSON.parse(json):json;if(p.opacity!==undefined)opacity=Math.max(0,Math.min(1,p.opacity));if(p.scale!==undefined)scale=Math.max(0.15,Math.min(1.5,p.scale));if(p.rotation!==undefined)orientation=p.rotation*Math.PI/180}
canvas.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;rot+=(e.clientX-px)*0.01;tilt=Math.max(-.9,Math.min(.9,tilt+(e.clientY-py)*.005));px=e.clientX;py=e.clientY});
canvas.addEventListener('pointerup',()=>down=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(2.7,Math.min(7,zoom+e.deltaY*.008))},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDistance)zoom=Math.max(2.7,Math.min(7,zoom+(touchDistance-d)*.014));touchDistance=d}}, {passive:true});
canvas.addEventListener('touchend',()=>touchDistance=0);
try{init()}catch(e){status('Viewer error: '+e.message)}
</script></body></html>
