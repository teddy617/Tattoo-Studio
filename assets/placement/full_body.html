<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202127}
canvas{width:100%;height:100%;display:block;touch-action:none}
#status{position:absolute;bottom:9px;left:8px;right:8px;color:#ddd;text-align:center;font:12px sans-serif;pointer-events:none}
</style></head><body><canvas id="view"></canvas><div id="status">Loading body model…</div>
<script>
'use strict';
// Offline WebGL placement studio with licensed anatomical mesh and procedural fallback.
(function(){
const canvas=document.getElementById('view'),label=document.getElementById('status');
const bridge=value=>{if(window.PlacementBridge)window.PlacementBridge.postMessage(value)};
const notify=value=>{label.textContent=value;if(value!=='ready')bridge(value)};
window.addEventListener('error',e=>notify('3D viewer error: '+e.message));
const gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){notify('WebGL is not available on this device');return}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const skin=[.71,.51,.44];
const VS=[
'attribute vec3 aPos;attribute vec3 aNormal;attribute vec2 aUV;',
'uniform vec3 uFocus;uniform float uYaw,uPitch,uDistance,uAspect;',
'varying vec3 vNormal,vWorld,vSurfaceNormal;varying vec2 vUV;',
'void main(){',
'float c=cos(uYaw),s=sin(uYaw),cp=cos(uPitch),sp=sin(uPitch);',
'vec3 p=aPos-uFocus;',
'vec3 r=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);',
'r=vec3(r.x,cp*r.y-sp*r.z,sp*r.y+cp*r.z);',
'vec3 n=vec3(c*aNormal.x+s*aNormal.z,aNormal.y,-s*aNormal.x+c*aNormal.z);',
'vNormal=normalize(vec3(n.x,cp*n.y-sp*n.z,sp*n.y+cp*n.z));',
'float z=max(.1,uDistance-r.z);',
'gl_Position=vec4(2.65*r.x/(uAspect*z),2.65*r.y/z,(z-2.0)/12.0,1.0);',
'vUV=aUV;vWorld=aPos;vSurfaceNormal=normalize(aNormal);',
'}'
].join('\n');
const FS=[
'precision mediump float;',
'varying vec3 vNormal,vWorld,vSurfaceNormal;varying vec2 vUV;',
'uniform vec3 uSkin,uAnchor,uNormal,uRight,uUp;',
'uniform sampler2D uInk;',
'uniform float uInkEnabled,uOpacity,uWidth,uAngle,uWrap,uCenterU,uCenterV,uImageRatio,uSelected,uPass,uFeather,uCurvature,uGeodesic;',
'void main(){',
'float light=.65+.35*max(.0,dot(normalize(vNormal),normalize(vec3(.38,.55,1.))));',
'vec3 base=uSkin*light;',
'if(uPass<.5){gl_FragColor=vec4(base,1.);return;}',
'if(uSelected<.5||uInkEnabled<.5) discard;',
'vec4 ink=vec4(0.);',
'{',
'vec3 relative=vWorld-uAnchor;',
'float width=max(.01,uWidth);',
'float height=max(.01,width*uImageRatio);',
'float depth=abs(dot(relative,uNormal));',
'float maxDepth=mix(.025,.52,clamp(uWrap/1.2,0.,1.));',
'float minimumFacing=mix(.68,-.20,clamp(uWrap/1.2,0.,1.));',
'float facing=dot(normalize(vSurfaceNormal),uNormal);',
'vec2 p;',
'if(uGeodesic<.5){',
'if(depth>maxDepth)discard;',
'if(facing<minimumFacing)discard;',
'vec2 planar=vec2(dot(relative,uRight),dot(relative,uUp));',
'// Locally unfold curved skin using its changing surface normal.',
'vec3 nn=normalize(vSurfaceNormal);',
'float facingClamped=max(.08,dot(nn,uNormal));',
'vec2 sideways=vec2(dot(nn,uRight),dot(nn,uUp));',
'vec2 theta=atan(sideways,vec2(facingClamped));',
'vec2 sine=sin(theta);',
'vec2 factor=vec2(1.);',
'if(abs(sine.x)>.05)factor.x=clamp(abs(theta.x/sine.x),1.,2.5);',
'if(abs(sine.y)>.05)factor.y=clamp(abs(theta.y/sine.y),1.,2.5);',
'vec2 unfolded=mix(planar,planar*factor,clamp(uCurvature,0.,1.));',
'p=vec2(unfolded.x/width,unfolded.y/height);',
'}else{',
'// Surface-patch UV stores length along the mesh, not planar distance.',
'p=vec2(vUV.x/width,vUV.y/height);',
'}',
'float c=cos(uAngle),s=sin(uAngle);',
'p=vec2(c*p.x-s*p.y,s*p.x+c*p.y)+.5;',
'if(p.x>=.0&&p.x<=1.&&p.y>=.0&&p.y<=1.){',
' ink=texture2D(uInk,p);',
' float edge=min(min(p.x,1.-p.x),min(p.y,1.-p.y));',
' float edgeFade=smoothstep(0.,max(.0005,uFeather),edge);',
' float faceFade=uGeodesic>.5?1.:smoothstep(minimumFacing,minimumFacing+.18,facing);',
' float depthFade=uGeodesic>.5?1.:1.-smoothstep(maxDepth*.75,maxDepth,depth);',
' ink.a*=edgeFade*faceFade*depthFade;',
'}',
'}',
'if(ink.a<.002)discard;',
'gl_FragColor=vec4(ink.rgb*light,ink.a*uOpacity);',
'}'
].join('\n');
function shader(type,source){
const h=gl.createShader(type);gl.shaderSource(h,source);gl.compileShader(h);
if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(h));return h;
}
let program;
try{
program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
}catch(e){notify('3D shader failed: '+e.message);return}
gl.useProgram(program);
const uni=name=>gl.getUniformLocation(program,name);
const u={focus:uni('uFocus'),yaw:uni('uYaw'),pitch:uni('uPitch'),distance:uni('uDistance'),aspect:uni('uAspect'),
skin:uni('uSkin'),enabled:uni('uInkEnabled'),opacity:uni('uOpacity'),width:uni('uWidth'),angle:uni('uAngle'),
wrap:uni('uWrap'),centerU:uni('uCenterU'),centerV:uni('uCenterV'),ratio:uni('uImageRatio'),selected:uni('uSelected'),pass:uni('uPass'),anchor:uni('uAnchor'),normal:uni('uNormal'),right:uni('uRight'),up:uni('uUp'),feather:uni('uFeather'),curvature:uni('uCurvature'),geodesic:uni('uGeodesic')};
const meshes=[];
const proxyMeshes=meshes;
let detailedMeshes=null;
let activeMeshes=meshes;
let skinGraph=null;
let useDetailed=true;
let preferDetailed=true;
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function normalized(a){const d=Math.hypot(...a)||1;return a.map(v=>v/d)}
// Profile tube with elliptical cross sections and smooth radii interpolation.
// Its UVs stick to each body-part surface as the model rotates.
function tube(id,start,end,profile,opt){
opt=opt||{};
const axis=normalized(end.map((v,i)=>v-start[i]));
let side=normalized([1,0,0].map((v,i)=>v-axis[i]*axis[0]));
if(Math.hypot(...side)<.1)side=[0,0,1];
const front=normalized(cross(axis,side)); // Downward axis gives front toward +Z.
const length=Math.hypot(...end.map((v,i)=>v-start[i]));
const rings=opt.rings||26,segments=opt.segments||48,verts=[],indices=[],points=[];
function shape(v){
const pos=v*(profile.length-1),index=Math.min(profile.length-2,Math.floor(pos)),t=pos-index;
return [lerp(profile[index][0],profile[index+1][0],t),
lerp(profile[index][1],profile[index+1][1],t)];
}
for(let row=0;row<=rings;row++){
const v=row/rings,center=start.map((a,i)=>a+axis[i]*length*v),r=shape(v);
for(let col=0;col<=segments;col++){
const angle=col/segments*Math.PI*2,cs=Math.cos(angle),sn=Math.sin(angle);
const nx=side.map((a,i)=>a*sn/r[0]+front[i]*cs/r[1]);
const n=normalized(nx),p=center.map((a,i)=>a+side[i]*r[0]*sn+front[i]*r[1]*cs);
verts.push(...p,...n,col/segments,v);points.push(p);
}
}
for(let row=0;row<rings;row++)for(let col=0;col<segments;col++){
const i=row*(segments+1)+col;
indices.push(i,i+segments+1,i+1,i+1,i+segments+1,i+segments+2);
}
const vb=gl.createBuffer(),ib=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
const center=start.map((a,i)=>(a+end[i])/2);
const radius=Math.max(...points.map(p=>Math.hypot(...p.map((v,i)=>v-center[i]))));
meshes.push({id,vb,ib,points,indices,verts,count:indices.length,center,radius,isBack:!!opt.back});
}
// A deliberately simplified figure; anatomical GLB models are a later milestone.
tube('head',[0,3.10,0],[0,2.28,0],[[.11,.13],[.29,.28],[.32,.30],[.27,.27],[.09,.13]]);
tube('neck',[0,2.31,0],[0,2.02,0],[[.13,.13],[.16,.15],[.18,.17]]);
tube('torso',[0,2.02,0],[0,.48,0],[[.28,.23],[.66,.35],[.70,.37],[.54,.29],[.40,.28]]);
tube('pelvis',[0,.49,0],[0,-.21,0],[[.40,.29],[.55,.32],[.50,.32],[.36,.26]]);
function limb(side){
const sign=side==='left'?-1:1,tag=side==='left'?'left':'right';
tube(tag+'UpperArm',[sign*.73,1.82,0],[sign*.92,.67,0],[[.24,.25],[.25,.26],[.19,.20]]);
tube(tag+'Forearm',[sign*.92,.70,0],[sign*1.04,-.34,.05],[[.20,.21],[.18,.19],[.115,.13]]);
tube(tag+'Hand',[sign*1.04,-.31,.05],[sign*1.06,-.68,.10],[[.14,.09],[.14,.08],[.09,.07]]);
tube(tag+'Thigh',[sign*.31,-.16,0],[sign*.34,-1.77,.02],[[.29,.31],[.29,.29],[.19,.20]]);
tube(tag+'Calf',[sign*.34,-1.75,.02],[sign*.33,-3.05,.12],[[.19,.20],[.23,.24],[.12,.13]]);
tube(tag+'Foot',[sign*.33,-3.02,.05],[sign*.33,-3.30,.20],[[.13,.19],[.16,.26],[.13,.21]]);
}
limb('left');limb('right');

// MakeHuman hm08 CC0 mesh (provided by Flutter as bundled text to avoid
// Android WebView file:// fetch/module restrictions). Proxy stays available.
let anatomyParts=[];
window.appendAnatomy=function(chunk){anatomyParts.push(chunk)};
window.finishAnatomy=function(){
 const source=anatomyParts.join('');anatomyParts=[];
 try{
  const lines=source.split('\n'),vertices=[],faces=[];
  for(const line of lines){
   if(line.startsWith('v ')){
    const v=line.slice(2).trim().split(/\s+/).map(Number);
    vertices.push([v[0]*.385,v[1]*.385,v[2]*.385]);
   }else if(line.startsWith('f ')){
    const ids=line.slice(2).trim().split(/\s+/).map(t=>Number(t)-1);
    for(let i=1;i<ids.length-1;i++)faces.push([ids[0],ids[i],ids[i+1]]);
   }
  }
  const normals=vertices.map(()=>[0,0,0]);
  for(const [a,b,c] of faces){
   const p=vertices[a],q=vertices[b],r=vertices[c];
   const n=cross(q.map((v,i)=>v-p[i]),r.map((v,i)=>v-p[i]));
   for(const idx of [a,b,c])for(let i=0;i<3;i++)normals[idx][i]+=n[i];
  }
  for(let i=0;i<normals.length;i++)normals[i]=normalized(normals[i]);
  // Shared mesh edges continue across visualization-region boundaries.
  const neighbors=vertices.map(()=>[]);
  for(const triangle of faces){
    for(let k=0;k<3;k++){
      const a=triangle[k],b=triangle[(k+1)%3];
      const length=Math.hypot(...vertices[a].map((v,j)=>v-vertices[b][j]));
      if(length>.000001){
        neighbors[a].push([b,length]);
        neighbors[b].push([a,length]);
      }
    }
  }
  skinGraph={vertices,normals,faces,neighbors};
  const groups=new Map();
  function group(p){
   const x=p[0],y=p[1];
   if(y>2.30)return 'head';
   if(y>1.95&&Math.abs(x)<.24)return 'neck';
   if(y>.35 && Math.abs(x)>1.03){
    const side=x<0?'left':'right',ab=Math.abs(x);
    return side+(ab>1.68?'Hand':ab>1.30?'Forearm':'UpperArm');
   }
   if(y>.35)return 'torso';
   if(y>-.15)return 'pelvis';
   const side=x<0?'left':'right';
   if(y< -2.85)return side+'Foot';
   if(y< -1.65)return side+'Calf';
   return side+'Thigh';
  }
  function uv(id,p){
   const x=p[0],y=p[1],z=p[2];
   const left=id.startsWith('left'),right=id.startsWith('right');
   const limb=left||right;
   const cx=limb?(left?-1.07:1.07):0;
   const angle=Math.atan2(x-cx,z-.16)/(2*Math.PI);
   let lo=-.15,hi=2.30;
   if(id==='head'){lo=2.30;hi=3.28}
   else if(id==='neck'){lo=1.95;hi=2.30}
   else if(id==='pelvis'){lo=-.15;hi=.35}
   else if(id.endsWith('Forearm')){lo=.35;hi=1.85}
   else if(id.endsWith('UpperArm')){lo=.35;hi=2.1}
   else if(id.endsWith('Hand')){lo=.35;hi=1.85}
   else if(id.endsWith('Thigh')){lo=-1.65;hi=-.15}
   else if(id.endsWith('Calf')){lo=-2.85;hi=-1.65}
   else if(id.endsWith('Foot')){lo=-3.3;hi=-2.85}
   return [((angle%1)+1)%1,clamp((y-lo)/(hi-lo),0,1)];
  }
  // For each face, classify by centroid and supply enough vertex/normal/UV
  // data for the same interactive tattoo shader used by the proxy meshes.
  for(const tri of faces){
   const center=[0,0,0];
   for(const idx of tri)for(let j=0;j<3;j++)center[j]+=vertices[idx][j]/3;
   const id=group(center);
   if(!groups.has(id))groups.set(id,{id,verts:[],points:[],indices:[],min:[Infinity,Infinity,Infinity],max:[-Infinity,-Infinity,-Infinity]});
   const dest=groups.get(id);
   for(const idx of tri){
    const p=vertices[idx],n=normals[idx],tex=uv(id,p);
    const next=dest.points.length;
    dest.indices.push(next);
    dest.points.push(p);
    dest.verts.push(...p,...n,...tex);
    for(let j=0;j<3;j++){dest.min[j]=Math.min(dest.min[j],p[j]);dest.max[j]=Math.max(dest.max[j],p[j])}
   }
  }
  const out=[];
  for(const data of groups.values()){
   if(data.indices.length>65000)throw Error('Mesh too large: '+data.id);
   const vb=gl.createBuffer(),ib=gl.createBuffer();
   gl.bindBuffer(gl.ARRAY_BUFFER,vb);
   gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.verts),gl.STATIC_DRAW);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(data.indices),gl.STATIC_DRAW);
   out.push({id:data.id,vb,ib,verts:data.verts,points:data.points,indices:data.indices,
    count:data.indices.length,center:data.min.map((v,i)=>(v+data.max[i])/2),
    radius:Math.hypot(...data.max.map((v,i)=>(v-data.min[i])/2))});
  }
  const previousMeshes=activeMeshes;
  detailedMeshes=out;useDetailed=preferDetailed;
  activeMeshes=useDetailed?detailedMeshes:proxyMeshes;
  if(previousMeshes!==activeMeshes){
    for(const t of tattoos.values()){
      releaseSurfacePatch(t);
      t.anchor=null;t.normal=null;
      t.drawnAnchor=null;t.drawnNormal=null;t.drawnRight=null;
    }
  }
  label.textContent='Anatomical MakeHuman model ready';
  view(focusRegion,false);
  bridge(JSON.stringify({type:'anatomyLoaded',meshes:out.length,faces:faces.length}));
 }catch(e){
  activeMeshes=proxyMeshes;useDetailed=false;skinGraph=null;
  bridge(JSON.stringify({type:'anatomyFailed',reason:e.message}));
  label.textContent='Using basic mannequin: detailed model unavailable';
 }
};
window.setAnatomyMode=function(value){
 const before=activeMeshes;
 preferDetailed=value==='detailed';
 useDetailed=preferDetailed&&detailedMeshes!==null;
 activeMeshes=useDetailed?detailedMeshes:proxyMeshes;
 if(before!==activeMeshes){
  for(const t of tattoos.values()){
   releaseSurfacePatch(t);
   t.anchor=null;t.normal=null;t.drawnAnchor=null;t.drawnNormal=null;t.drawnRight=null;
  }
 }
 view(focusRegion,false);
};
const regions={
full:null,head:'head',chest:'torso',back:'torso',abdomen:'torso',pelvis:'pelvis',
leftUpperArm:'leftUpperArm',rightUpperArm:'rightUpperArm',
leftForearm:'leftForearm',rightForearm:'rightForearm',
leftThigh:'leftThigh',rightThigh:'rightThigh',
leftCalf:'leftCalf',rightCalf:'rightCalf',
leftHand:'leftHand',rightHand:'rightHand',leftFoot:'leftFoot',rightFoot:'rightFoot'
};
const meshBy=id=>activeMeshes.find(m=>m.id===id);

let focusRegion='full',mode='orbit';
let yaw=.22,pitch=.03,distance=10.7,focus=[0,0,0],targetDistance=10.7,targetFocus=[0,0,0];
// Each tattoo carries an independent GPU texture, selected anatomical region,
// UV anchor, orientation and alpha. Rendered anchors are eased for smoother drag.
const tattoos=new Map();
const order=[];
let activeId='current';
const defaults=(id)=>({
 id,bodyPart:'rightForearm',centerU:0,centerV:.52,
 anchor:null,normal:null,drawnAnchor:null,drawnNormal:null,drawnRight:null,widthCm:8,
 drawnU:0,drawnV:.52,scale:.65,rotation:0,opacity:.9,depth:.65,
 imageRatio:1,texture:null,visible:true,feather:0.025,curvature:0.75,surfacePatch:true
});
function current(){return tattoos.get(activeId)}
function uploadTexture(id,uri,initial){
 if(!tattoos.has(id)){
  if(order.length>=12){notify('Maximum 12 tattoos in preview');return}
  tattoos.set(id,defaults(id));order.push(id);
 }
 const tattoo=tattoos.get(id);
 if(initial && typeof initial==='object')Object.assign(tattoo,initial);
 const img=new Image();
 img.onload=()=>{
  if(tattoo.texture)gl.deleteTexture(tattoo.texture);
  const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  tattoo.texture=tex;tattoo.imageRatio=img.height/img.width;
  label.textContent='Multiple tattoos placed on independent body surfaces';
  save();
 };
 img.onerror=()=>notify('Could not load tattoo image');
 img.src=uri;
}
function save(){
 bridge(JSON.stringify({type:'state',activeId,viewPart:focusRegion,
 tattoos:order.map(id=>{
   const t=tattoos.get(id);
   return {id,bodyPart:t.bodyPart,centerU:t.centerU,centerV:t.centerV,
    anchor:t.anchor,normal:t.normal,widthCm:t.widthCm,
    scale:t.scale,rotation:t.rotation,opacity:t.opacity,depth:t.depth,feather:t.feather,curvature:t.curvature,surfacePatch:t.surfacePatch,
    visible:t.visible};
 })}));
}
function view(region,autoPlace){
 if(!Object.prototype.hasOwnProperty.call(regions,region))region='full';
 focusRegion=region;
 if(region==='full'){
  targetFocus=[0,-.06,0];targetDistance=10.7;
 }else{
  const id=regions[region],mesh=meshBy(id);
  targetFocus=mesh?mesh.center.slice():[0,0,0];
  targetDistance=id==='torso'?3.9:id==='head'?3.1:2.9;
  if(region==='back')yaw=Math.PI;
  const t=current();
  if(autoPlace&&id&&t){
   t.bodyPart=region;
   t.centerU=region==='back'?.5:0;
   t.centerV=region==='abdomen'?.22:.5;
   // Select a real point on the chosen mesh; do not project from the
   // previously selected limb's anchor after changing body parts.
   let nearest=0,best=Infinity;
   for(let i=0;i<mesh.points.length;i++){
     const uvU=mesh.verts[i*8+6],uvV=mesh.verts[i*8+7];
     const du=Math.abs(uvU-t.centerU);
     const d=Math.pow(Math.min(du,1-du),2)+Math.pow(uvV-t.centerV,2);
     if(d<best){best=d;nearest=i}
   }
   t.anchor=mesh.points[nearest].slice();
   t.normal=normalized(mesh.verts.slice(nearest*8+3,nearest*8+6));
   t.drawnAnchor=t.anchor.slice();
   t.drawnNormal=null;t.drawnRight=null;
  }
 }
 save();
}
window.selectPart=function(region){view(region,true)};
window.setTattoo=function(uri){uploadTexture('current',uri)};
window.addTattoo=function(id,uri,state){
 uploadTexture(String(id),uri,state||null);
 activeId=String(id);
 save();
};
window.selectTattoo=function(id){
 if(!tattoos.has(id))return;
 activeId=id;
 const t=current();
 if(focusRegion!=='full' && regions[focusRegion]!==regions[t.bodyPart])
   view(t.bodyPart,false);
 save();
};
window.removeTattoo=function(id){
 if(id==='current')return;
 const t=tattoos.get(id);
 if(!t)return;
 if(t.texture)gl.deleteTexture(t.texture);
 releaseSurfacePatch(t);
 tattoos.delete(id);
 const i=order.indexOf(id);if(i>=0)order.splice(i,1);
 if(activeId===id)activeId='current';
 save();
};
window.setPlacement=function(raw){
 const p=typeof raw==='string'?JSON.parse(raw):raw;
 const t=current();if(!t)return;
 if(typeof p.opacity==='number')t.opacity=clamp(p.opacity,0,1);
 if(typeof p.scale==='number')t.scale=clamp(p.scale,.15,1.5);
 if(typeof p.rotation==='number')t.rotation=clamp(p.rotation,-180,180);
 if(typeof p.depth==='number')t.depth=clamp(p.depth,.15,1.2);
 if(typeof p.feather==='number')t.feather=clamp(p.feather,0,.15);
 if(typeof p.curvature==='number')t.curvature=clamp(p.curvature,0,1);
 if(typeof p.surfacePatch==='boolean'){
  t.surfacePatch=p.surfacePatch;
  if(!t.surfacePatch)releaseSurfacePatch(t);
 }
 if(typeof p.visible==='boolean')t.visible=p.visible;
 if(typeof p.widthCm==='number'){
  t.widthCm=clamp(p.widthCm,1,40);
  t.patchPendingUntil=performance.now()+160;
 }
};
window.restorePlacement=function(raw){
 const p=typeof raw==='string'?JSON.parse(raw):raw;
 const oldGeometry=p.modelVersion!=='anatomy-mainbody-v2';
 if(Array.isArray(p.tattoos)){
  for(const record of p.tattoos){
   const t=tattoos.get(record.id);
   if(!t)continue;
   Object.assign(t,record);
   if(oldGeometry){releaseSurfacePatch(t);t.anchor=null;t.normal=null;t.drawnAnchor=null;}
   t.drawnU=t.centerU;t.drawnV=t.centerV;
   if(Array.isArray(t.anchor))t.drawnAnchor=t.anchor.slice();
  }
  if(tattoos.has(p.activeId))activeId=p.activeId;
 }else{
  const t=current();
  if(t){
   window.setPlacement(p);
   if(typeof p.bodyPart==='string'&&Object.prototype.hasOwnProperty.call(regions,p.bodyPart))t.bodyPart=p.bodyPart;
   if(typeof p.centerU==='number')t.centerU=p.centerU;
   else if(Array.isArray(p.point))t.centerU=Math.atan2(p.point[0],p.point[2])/(2*Math.PI);
   if(typeof p.centerV==='number')t.centerV=p.centerV;
   if(oldGeometry){releaseSurfacePatch(t);t.anchor=null;t.normal=null;t.drawnAnchor=null;}
   t.drawnU=t.centerU;t.drawnV=t.centerV;
   if(Array.isArray(t.anchor))t.drawnAnchor=t.anchor.slice();
  }
 }
 view(p.viewPart&&Object.prototype.hasOwnProperty.call(regions,p.viewPart)?p.viewPart:'full',false);
 save();
};
window.setMode=function(value){
 mode=value==='place'?'place':'orbit';
 label.textContent=mode==='place'?'Drag the active tattoo along the body':'Drag to orbit • Pinch to zoom';
};
window.resetView=function(){
 yaw=.22;pitch=.03;
 view(focusRegion,false);
};
window.nudgeTattoo=function(dx,dy){
 const t=current();if(!t)return;
 const mesh=meshBy(regions[t.bodyPart]);if(!mesh||!mesh.points.length)return;
 if(!Array.isArray(t.anchor)||!Array.isArray(t.normal))return;
 const n=normalized(t.normal);
 const vertical=Math.abs(n[1])>.90?[0,0,1]:[0,1,0];
 const tangent=normalized(cross(vertical,n));
 const up=normalized(cross(n,tangent));
 // Each nudge is approximately 5 mm on the illustrative 170 cm mannequin.
 const step=6.52*0.5/170;
 const target=t.anchor.map((v,i)=>v+step*(dx*tangent[i]+dy*up[i]));
 let nearest=0,best=Infinity;
 for(let i=0;i<mesh.points.length;i++){
  const p=mesh.points[i];
  const d=(p[0]-target[0])**2+(p[1]-target[1])**2+(p[2]-target[2])**2;
  if(d<best){best=d;nearest=i}
 }
 t.anchor=mesh.points[nearest].slice();
 t.normal=normalized(mesh.verts.slice(nearest*8+3,nearest*8+6));
 t.centerU=mesh.verts[nearest*8+6];
 t.centerV=mesh.verts[nearest*8+7];
 save();
};
window.resetPlacement=function(){
 const t=current();if(!t)return;
 Object.assign(t,{centerU:0,centerV:.5,drawnU:0,drawnV:.5,anchor:null,normal:null,drawnAnchor:null,scale:.65,widthCm:8,rotation:0,opacity:.9,depth:.65,feather:.025,curvature:.75,surfacePatch:true});
 save();
};
function transform(p){
const q=p.map((v,i)=>v-focus[i]);
const c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
const x=c*q[0]+s*q[2],z=-s*q[0]+c*q[2];
return [x,cp*q[1]-sp*z,sp*q[1]+cp*z];
}
function projected(p){
const r=transform(p),z=distance-r[2],aspect=canvas.width/canvas.height;
return [(1+2.65*r[0]/(aspect*z))*canvas.width/2,
(1-2.65*r[1]/z)*canvas.height/2,z];
}
// Triangle-accurate screen-space picking: barycentric UV on nearest surface.
// Unlike the old closest-vertex method this can select between vertices smoothly.
function pick(clientX,clientY,lockToPart=false){
const box=canvas.getBoundingClientRect();
const x=(clientX-box.left)*canvas.width/box.width,y=(clientY-box.top)*canvas.height/box.height;
let best=null,bestDepth=Infinity;
for(const mesh of activeMeshes){
const target=lockToPart&&current()?regions[current().bodyPart]:null;
const allow=(focusRegion==='full'||regions[focusRegion]===mesh.id)&&
 (!target||target===mesh.id);
if(!allow)continue;
// Reuse projected vertices while the camera is steady, avoiding large
// per-touch allocations for the detailed 19k-vertex anatomy.
const cameraKey=[yaw,pitch,distance,...focus,canvas.width,canvas.height]
  .map(v=>Math.round(v*100)).join(':');
if(mesh.pickCameraKey!==cameraKey){
 mesh.pickCameraKey=cameraKey;
 mesh.pickProjection=mesh.points.map(projected);
}
const projectedVertices=mesh.pickProjection;
for(let t=0;t<mesh.indices.length;t+=3){
const ia=mesh.indices[t],ib=mesh.indices[t+1],ic=mesh.indices[t+2];
const a=projectedVertices[ia],b=projectedVertices[ib],c=projectedVertices[ic];
if(a[2]<=0||b[2]<=0||c[2]<=0)continue;
const denom=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
if(Math.abs(denom)<.000001)continue;
const u=((b[1]-c[1])*(x-c[0])+(c[0]-b[0])*(y-c[1]))/denom;
const v=((c[1]-a[1])*(x-c[0])+(a[0]-c[0])*(y-c[1]))/denom;
const w=1-u-v;
if(u<-.001||v<-.001||w<-.001)continue;
const inverse=u/a[2]+v/b[2]+w/c[2],depth=1/inverse;
if(depth>=bestDepth)continue;
const aw=u/a[2]/inverse,bw=v/b[2]/inverse,cw=w/c[2]/inverse;
const U=mesh.verts[ia*8+6]*aw+mesh.verts[ib*8+6]*bw+mesh.verts[ic*8+6]*cw;
const V=mesh.verts[ia*8+7]*aw+mesh.verts[ib*8+7]*bw+mesh.verts[ic*8+7]*cw;
const position=[0,0,0],normal=[0,0,0];
for(let k=0;k<3;k++){
 position[k]=mesh.points[ia][k]*aw+mesh.points[ib][k]*bw+mesh.points[ic][k]*cw;
 normal[k]=mesh.verts[ia*8+3+k]*aw+
  mesh.verts[ib*8+3+k]*bw+mesh.verts[ic*8+3+k]*cw;
}
bestDepth=depth;
best={mesh,U,V,position,normal:normalized(normal)};
}
}
if(!best)return;
const match=Object.keys(regions).find(key=>key!=='full'&&regions[key]===best.mesh.id);
const t=current();if(!t)return false;
if(focusRegion==='full')t.bodyPart=best.mesh.id==='torso'?(best.U>.25&&best.U<.75?'back':'chest'):(match||'chest');
else t.bodyPart=focusRegion;
t.centerU=best.U;t.centerV=best.V;
t.anchor=best.position;t.normal=best.normal;
if(lockToPart)t.dragging=true;
if(!t.drawnAnchor)t.drawnAnchor=best.position.slice();
return true;
}
let active=new Map(),pinching=false,lastPinch=0,lastSave=0,lastPick=0;
canvas.addEventListener('pointerdown',e=>{
canvas.setPointerCapture(e.pointerId);
active.set(e.pointerId,{x:e.clientX,y:e.clientY,wasMoved:false});
// Pointer positions are kept in the active pointer map.
});
canvas.addEventListener('pointermove',e=>{
if(!active.has(e.pointerId))return;
const prev=active.get(e.pointerId);
active.set(e.pointerId,{x:e.clientX,y:e.clientY,
 wasMoved:prev.wasMoved||Math.hypot(e.clientX-prev.x,e.clientY-prev.y)>2});
if(active.size>=2){
const pts=[...active.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
if(lastPinch)targetDistance=clamp(targetDistance*lastPinch/d,2.25,15);
lastPinch=d;pinching=true;return;
}
const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
if(mode==='orbit'){
yaw+=dx*.009;pitch=clamp(pitch+dy*.006,-1.25,1.25);
}else if(performance.now()-lastPick>(activeMeshes===detailedMeshes?85:35)){
  if(pick(e.clientX,e.clientY,true)&&performance.now()-lastSave>120){
    save();lastSave=performance.now();
  }
  lastPick=performance.now();
}
});
canvas.addEventListener('pointerup',e=>{
if(mode==='place'&&!pinching){
 const gesture=active.get(e.pointerId);
 pick(e.clientX,e.clientY,!!gesture?.wasMoved);
}
active.delete(e.pointerId);
if(active.size<2)lastPinch=0;
if(active.size===0){
 pinching=false;
 const t=current();if(t)t.dragging=false;
 if(mode==='place')save();
}
});
canvas.addEventListener('pointercancel',e=>{
 active.delete(e.pointerId);lastPinch=0;pinching=false;
 const t=current();if(t)t.dragging=false;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();targetDistance=clamp(targetDistance*(1+Math.sign(e.deltaY)*.07),2.25,15)},{passive:false});

// A bounded, mesh-connected local surface chart for each tattoo.
// Unlike a projection ray, shortest paths cannot jump across a gap in skin.
// Charts are constructed only on demand, not every frame.
function releaseSurfacePatch(t){
 if(t.patch){
  gl.deleteBuffer(t.patch.vb);
  gl.deleteBuffer(t.patch.ib);
 }
 t.patch=null;
 t.patchSignature=null;
}
function transportRight(right,normal){
 const d=dot(right,normal);
 const candidate=right.map((v,k)=>v-d*normal[k]);
 if(Math.hypot(...candidate)>.12)return normalized(candidate);
 const reference=Math.abs(normal[1])>.9?[0,0,1]:[0,1,0];
 return normalized(cross(reference,normal));
}
function createSurfacePatch(t,width){
 if(!skinGraph||!Array.isArray(t.anchor)||!Array.isArray(t.normal))
  return null;
 const {vertices,normals,faces,neighbors}=skinGraph;
 const count=vertices.length;
 // Limit path search to the diagonal of the intended artwork plus padding.
 const ratio=clamp(t.imageRatio,.2,4);
 const radius=Math.min(2.25,Math.max(.1,.63*Math.hypot(width,width*ratio)+.065));
 let source=0,closest=Infinity;
 for(let i=0;i<count;i++){
  const p=vertices[i],distance=Math.hypot(...p.map((v,k)=>v-t.anchor[k]));
  if(distance<closest){closest=distance;source=i}
 }
 if(closest>.18)return null;
 const dists=new Float32Array(count);
 dists.fill(Infinity);dists[source]=0;
 const reached=new Uint8Array(count);
 const uv=new Array(count),rights=new Array(count);
 const startNormal=normals[source];
 const initialRight=t.drawnRight||cross(
   Math.abs(startNormal[1])>.9?[0,0,1]:[0,1,0],startNormal);
 rights[source]=transportRight(normalized(initialRight),startNormal);
 uv[source]=[0,0];
 // Binary min heap: [distance, vertex].
 const heap=[];
 function put(value){
  heap.push(value);
  for(let i=heap.length-1;i>0;){
   const parent=(i-1)>>1;
   if(heap[parent][0]<=heap[i][0])break;
   [heap[parent],heap[i]]=[heap[i],heap[parent]];
   i=parent;
  }
 }
 function take(){
  const first=heap[0],last=heap.pop();
  if(heap.length){
   heap[0]=last;
   for(let i=0;;){
    let a=i*2+1,b=a+1,best=i;
    if(a<heap.length&&heap[a][0]<heap[best][0])best=a;
    if(b<heap.length&&heap[b][0]<heap[best][0])best=b;
    if(best===i)break;
    [heap[i],heap[best]]=[heap[best],heap[i]];i=best;
   }
  }
  return first;
 }
 put([0,source]);
 let visited=0;
 while(heap.length){
  const [dist,i]=take();
  if(reached[i]||dist>radius)continue;
  reached[i]=1;
  if(++visited>12000)return null;
  const n=normals[i],right=rights[i],up=normalized(cross(n,right));
  for(const [j,len] of neighbors[i]){
   const next=dist+len;
   if(next>=dists[j]||next>radius)continue;
   dists[j]=next;
   const edge=vertices[j].map((v,k)=>v-vertices[i][k]);
   const dx=dot(edge,right),dy=dot(edge,up);
   const tangentLength=Math.hypot(dx,dy);
   const factor=tangentLength>.000001?len/tangentLength:1;
   uv[j]=[uv[i][0]+dx*factor,uv[i][1]+dy*factor];
   rights[j]=transportRight(right,normals[j]);
   put([next,j]);
  }
 }
 const data=[],indices=[];
 // Include full triangles only; boundary is outside the texture rectangle.
 for(const face of faces){
  if(!face.every(i=>reached[i]))continue;
  if(indices.length+3>60000)return null;
  for(const id of face){
   const p=vertices[id],n=normals[id],coords=uv[id];
   if(!coords)return null;
   data.push(...p,...n,...coords);
   indices.push(indices.length);
  }
 }
 if(!indices.length)return null;
 const vb=gl.createBuffer(),ib=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,vb);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
 return {vb,ib,count:indices.length,vertices:visited};
}

function render(){
const dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(canvas.clientWidth*dpr)),
h=Math.max(1,Math.round(canvas.clientHeight*dpr));
if(w!==canvas.width||h!==canvas.height){canvas.width=w;canvas.height=h}
distance=lerp(distance,targetDistance,.15);
focus=focus.map((value,i)=>lerp(value,targetFocus[i],.14));
gl.viewport(0,0,w,h);gl.clearColor(.12,.13,.16,1);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.useProgram(program);
gl.uniform3fv(u.focus,focus);
gl.uniform1f(u.yaw,yaw);gl.uniform1f(u.pitch,pitch);gl.uniform1f(u.distance,distance);
gl.uniform1f(u.aspect,w/h);gl.uniform3fv(u.skin,skin);

// Draw all opaque anatomy into the depth buffer, then composite each tattoo
// in its own pass with depth-test enabled. This preserves occlusion behind limbs.
function drawMesh(mesh){
 gl.bindBuffer(gl.ARRAY_BUFFER,mesh.vb);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.ib);
 for(const [name,offset,arity] of [['aPos',0,3],['aNormal',3,3],['aUV',6,2]]){
  const loc=gl.getAttribLocation(program,name);
  if(loc<0)continue;
  gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,arity,gl.FLOAT,false,32,offset*4);
 }
 gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);
}
gl.uniform1f(u.pass,0);gl.depthMask(true);gl.disable(gl.BLEND);
for(const mesh of activeMeshes)drawMesh(mesh);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
gl.depthMask(false);
gl.depthFunc(gl.LEQUAL);
gl.uniform1f(u.pass,1);gl.uniform1f(u.enabled,1);
let patchesBuiltThisFrame=0;
for(const id of order){
 const t=tattoos.get(id);
 if(!t||!t.texture||t.visible===false)continue;
 let diff=((t.centerU-t.drawnU+.5)%1+1)%1-.5;
 t.drawnU+=diff*.25;
 t.drawnV=lerp(t.drawnV,t.centerV,.25);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,t.texture);
 gl.uniform1f(u.opacity,t.opacity);
 // Generic MakeHuman model is scaled to an illustrative 170 cm tall body.
 // Width is an approximate arc-independent tattoo width, not printer calibration.
 const width=(t.widthCm || (8*t.scale/.65))*(6.52/170);
 const part=regions[t.bodyPart],body=meshBy(part);
 if(!t.anchor && body){
  // Legacy previews migrate to a point on the mesh nearest the stored UV.
  let bestDistance=Infinity,nearest=0;
  for(let i=0;i<body.points.length;i++){
   const du=Math.abs(body.verts[i*8+6]-t.centerU);
   const wrapDU=Math.min(du,1-du);
   const dv=body.verts[i*8+7]-t.centerV;
   const d=wrapDU*wrapDU+dv*dv;
   if(d<bestDistance){bestDistance=d;nearest=i}
  }
  t.anchor=body.points[nearest].slice();
  t.normal=normalized(body.verts.slice(nearest*8+3,nearest*8+6));
 }
 if(!Array.isArray(t.anchor)||!Array.isArray(t.normal))continue;
 if(!t.drawnAnchor)t.drawnAnchor=t.anchor.slice();
 t.drawnAnchor=t.drawnAnchor.map((v,i)=>lerp(v,t.anchor[i],.25));
 if(!t.drawnNormal)t.drawnNormal=t.normal.slice();
 t.drawnNormal=normalized(t.drawnNormal.map((v,i)=>lerp(v,t.normal[i],.18)));
 const n=normalized(t.drawnNormal);
 const upCandidate=Math.abs(n[1])>.9?[0,0,1]:[0,1,0];
 let right=null;
 if(Array.isArray(t.drawnRight)){
   const projection=dot(t.drawnRight,n);
   const candidate=t.drawnRight.map((v,i)=>v-projection*n[i]);
   if(Math.hypot(...candidate)>.1)right=normalized(candidate);
 }
 if(!right)right=normalized(cross(upCandidate,n));
 t.drawnRight=right.slice();
 const up=normalized(cross(n,right));
 gl.uniform3fv(u.anchor,t.drawnAnchor);
 gl.uniform3fv(u.normal,n);gl.uniform3fv(u.right,right);gl.uniform3fv(u.up,up);
 gl.uniform1f(u.width,width);
 gl.uniform1f(u.angle,t.rotation*Math.PI/180);
 gl.uniform1f(u.wrap,t.depth);
 gl.uniform1f(u.feather,clamp(t.feather??.025,0,.15));
 gl.uniform1f(u.curvature,clamp(t.curvature??.75,0,1));
 gl.uniform1f(u.centerU,t.drawnU);
 gl.uniform1f(u.centerV,t.drawnV);
 gl.uniform1f(u.ratio,clamp(t.imageRatio,.2,4));
 let usedPatch=false;
 if(t.surfacePatch!==false&&skinGraph&&activeMeshes===detailedMeshes&&!t.dragging){
  const signature=[...t.anchor.map(v=>v.toFixed(3)),width.toFixed(3),
    t.imageRatio.toFixed(3),t.bodyPart].join(':');
  if(t.patchSignature!==signature&&patchesBuiltThisFrame<1&&
     performance.now()>(t.patchPendingUntil||0)){
   releaseSurfacePatch(t);
   try{t.patch=createSurfacePatch(t,width)}
   catch(error){bridge(JSON.stringify({type:'patchWarning',reason:String(error)}))}
   t.patchSignature=signature;
   patchesBuiltThisFrame++;
  }
  if(t.patch&&t.patchSignature===signature){
    gl.uniform1f(u.selected,1);
    gl.uniform1f(u.geodesic,1);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(-1,-1);
    drawMesh(t.patch);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    usedPatch=true;
  }
 }
 if(usedPatch)continue;
 gl.uniform1f(u.geodesic,0);
 for(const mesh of activeMeshes){
  // Cull distant anatomy parts before each decal pass. Nearby regions
  // still participate, allowing a tattoo to cross a visible mesh seam.
  const distanceToPart=Math.hypot(...mesh.center.map((v,i)=>v-t.drawnAnchor[i]));
  const reach=Math.max(width,width*clamp(t.imageRatio,.2,4))*.72+
    .52+mesh.radius;
  if(distanceToPart>reach)continue;
  gl.uniform1f(u.selected,1);
  drawMesh(mesh);
 }
}
gl.depthMask(true);gl.disable(gl.BLEND);
requestAnimationFrame(render);
}
try{render();label.textContent='Drag to orbit • Pinch to zoom';bridge('ready')}
catch(e){notify('3D initialization error: '+e.message)}
})();
</script></body></html>
